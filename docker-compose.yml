name: windrose

services:
  # Fixes ownership of the save volume for the unprivileged uid the server
  # runs as. Docker creates the volume root-owned on first use since the
  # mountpoint doesn't pre-exist in the image; this runs before the server
  # on every start so a fresh volume never blocks it.
  init-container:
    image: alpine:3.23
    container_name: windrose-init
    user: root
    command: ["/bin/sh", "-c", "chown -R 10001:10001 /srv/windrose/R5/Saved"]
    volumes:
      - windrose-save:/srv/windrose/R5/Saved

  windrose-server:
    image: pfeiffermax/windrose-dedicated-server:latest
    pull_policy: always
    container_name: windrose-server
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      init-container:
        condition: service_completed_successfully

    # Invite-code play (default) is P2P/ICE with dynamically assigned ports,
    # which bridge networking breaks -- host networking is required there.
    # Direct connection uses one fixed port and works fine on host networking
    # too (already exposed on the host's real IP, no mapping needed); only
    # switch to bridge + uncomment ports: below if you have another reason
    # to want Docker's bridge networking specifically. See README.md
    # "Networking".
    network_mode: "${NETWORK_MODE:-host}"
    # ports:
    #   - "${DIRECT_CONNECTION_SERVER_PORT:-28050}:${DIRECT_CONNECTION_SERVER_PORT:-28050}/tcp"
    #   - "${DIRECT_CONNECTION_SERVER_PORT:-28050}:${DIRECT_CONNECTION_SERVER_PORT:-28050}/udp"

    environment:
      SERVER_NAME: "${SERVER_NAME:-Windrose}"
      INVITE_CODE: "${INVITE_CODE:-}"
      PASSWORD: "${PASSWORD:-}"
      MAX_PLAYER_COUNT: "${MAX_PLAYER_COUNT:-10}"
      USER_SELECTED_REGION: "${USER_SELECTED_REGION:-}"
      P2P_PROXY_ADDRESS: "${P2P_PROXY_ADDRESS:-0.0.0.0}"
      USE_DIRECT_CONNECTION: "${USE_DIRECT_CONNECTION:-false}"
      DIRECT_CONNECTION_SERVER_PORT: "${DIRECT_CONNECTION_SERVER_PORT:-28050}"
      # Leave empty until you've migrated a world in (see README). Once set,
      # it's also persisted on the volume and keeps loading on later starts.
      # Note: on the first start after setting this, the server may log
      # "does not exist" once or twice while it restores the world from
      # RocksDB_v2_Backups into the live save — that's expected, not a
      # failure. restart: unless-stopped means it just tries again.
      WORLD_ISLAND_ID: "${WORLD_ISLAND_ID:-}"
      AUTO_LOAD_LATEST_BACKUP_IF_HAS_BROKEN: "${AUTO_LOAD_LATEST_BACKUP_IF_HAS_BROKEN:-true}"

    volumes:
      - windrose-save:/srv/windrose/R5/Saved

    healthcheck:
      test: ["CMD-SHELL", "pgrep -f WindroseServer > /dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3

volumes:
  windrose-save:
    name: windrose-save-dir
